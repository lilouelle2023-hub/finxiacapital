# Netlify Configuration for FINXIA Capital Next.js SSG

[build]
  # Root directory for the Next.js app
  base = "frontend-nextjs"
  
  # Build command
  command = "yarn build"
  
  # Output directory (Next.js static export)
  publish = "out"

# Environment variables (if needed)
[build.environment]
  NODE_VERSION = "20"
  YARN_VERSION = "1.22.22"

# NO REDIRECTS - Let Netlify serve static files
# The _redirects file handles 404 fallback

# Custom headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

